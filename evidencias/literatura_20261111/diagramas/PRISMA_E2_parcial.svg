<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="Flujo parcial E2; base heredada y límites documentales"><rect width="1000" height="650" fill="#edf4f6"/><style>text{font-family:Arial,sans-serif;fill:#16384a}.title{font-size:27px;font-weight:bold}.h{font-size:21px;font-weight:bold}.b{font-size:17px}.small{font-size:16px}</style><text x="40" y="49" class="title">PRISMA E2 · Corte documental 12 noviembre 2026</text><text x="40" y="82" class="b">Flujo parcial: no representa una revisión sistemática cerrada.</text><rect x="35" y="110" width="445" height="425" rx="16" fill="white"/><rect x="510" y="110" width="455" height="425" rx="16" fill="white"/><text x="60" y="150" class="h">Recuperación heredada de E1</text><text x="60" y="195" class="b">13 informes pendientes al corte anterior</text><path d="M250 215v40m-8-8 8 8 8-8" fill="none" stroke="#14858c" stroke-width="3"/><text x="60" y="290" class="h">1 manuscrito recuperado en E2</text><text x="60" y="325" class="b">12 informes aún no recuperados</text><text x="60" y="385" class="small">La actualización no modifica el cierre de E1.</text><text x="60" y="415" class="small">Página de autores ≠ texto completo.</text><text x="535" y="150" class="h">Base multibase heredada</text><text x="535" y="195" class="b">Scopus 1.097 · WoS 328 · IEEE 292</text><text x="535" y="245" class="b">1.717 = 69 + 318 + 1.330</text><text x="535" y="285" class="b">1.330 = 820 + 330 + 1 + 13 + 166</text><text x="535" y="325" class="b">Estudios incluidos globales: NR</text><text x="535" y="385" class="small">12 referencias en síntesis focalizada.</text><text x="535" y="415" class="small">No equivalen al total de incluidos PRISMA.</text><text x="40" y="580" class="b">Exportaciones verificadas · Faltan historial exacto e identidad global de estudios.</text><text x="40" y="615" class="small">NR: no determinado. No se suman búsquedas, PDFs, versiones y estudios.</text></svg>